# Builds and tests every push and pull request. Pushing a tag like v0.2.0 also publishes a GitHub release
# with Mozaic-0.2.0-win-x64.zip (tags with a suffix, e.g. v0.2.0-beta.1, become pre-releases).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build, test and package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { $null }
          if ($version) { ./build.ps1 -Package -SkipDocs -Version $version } else { ./build.ps1 -Package -SkipDocs }

      - uses: actions/upload-artifact@v7
        with:
          name: mozaic-win-x64
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: mozaic-win-x64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          sed "s/{{VERSION}}/$version/g" .github/release-notes.md > notes.md
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/*.zip --title "Mozaic $version" --notes-file notes.md "${flags[@]}"
